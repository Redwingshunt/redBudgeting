<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Salary Budget & Splitter</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    
    <!-- Sidebar / Inputs Column -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-icon">⚡</div>
        <h2>SalaryEngine</h2>
      </div>

      <section class="card-section">
        <h3>Primary Package</h3>
        <div class="input-group">
          <label for="ctcInput">Annual CTC (₹ Lakhs)</label>
          <input type="number" id="ctcInput" value="20" step="0.5" min="1">
        </div>

        <div class="input-grid">
          <div class="input-group">
            <label for="regimeSelect">Tax Regime</label>
            <select id="regimeSelect">
              <option value="new" selected>New Regime</option>
              <option value="old">Old Regime</option>
            </select>
          </div>

          <div class="input-group">
            <label for="pfMode">EPF Mode</label>
            <select id="pfMode">
              <option value="full" selected>12% Full Basic</option>
              <option value="capped">Capped (₹1,800)</option>
            </select>
          </div>
        </div>
      </section>

      <!-- Dynamic Custom Deductions Section -->
      <section class="card-section">
        <div class="section-header">
          <h3>Custom Deductions</h3>
          <button id="addDeductionBtn" class="btn-icon" title="Add Deduction">+</button>
        </div>
        <div id="deductionsContainer" class="dynamic-list">
          <!-- Dynamic deduction inputs will render here -->
        </div>
      </section>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      
      <!-- Top Overview Cards -->
      <header class="stats-grid">
        <div class="stat-card hero-card">
          <span class="stat-label">Monthly In-Hand</span>
          <div class="stat-value" id="monthlyInHand">₹0</div>
          <span class="stat-sub" id="annualInHand">₹0 / year</span>
        </div>

        <div class="stat-card">
          <span class="stat-label">Gross Monthly</span>
          <div class="stat-value" id="grossMonthly">₹0</div>
          <span class="stat-sub">Before deductions</span>
        </div>

        <div class="stat-card">
          <span class="stat-label">Monthly Tax (TDS)</span>
          <div class="stat-value text-accent-red" id="monthlyTax">₹0</div>
          <span class="stat-sub" id="annualTax">₹0 / year</span>
        </div>

        <div class="stat-card">
          <span class="stat-label">Total EPF & Extras</span>
          <div class="stat-value text-accent-amber" id="totalDeductions">₹0</div>
          <span class="stat-sub">Monthly non-cash / investments</span>
        </div>
      </header>

      <!-- Budget Allocation Bar -->
      <section class="allocation-section">
        <div class="section-header">
          <h3>Allocation Breakdown</h3>
          <span id="allocationSummary" class="badge">100% Allocated</span>
        </div>
        <div class="progress-bar-container" id="progressBarContainer">
          <!-- Dynamic stack segments render here -->
        </div>
      </section>

      <!-- Dynamic Budget Splitter Buckets -->
      <section class="splitter-section">
        <div class="section-header">
          <h3>Budget Splitter Buckets</h3>
          <button id="addBucketBtn" class="btn-primary">+ Add Budget Category</button>
        </div>

        <div id="bucketsGrid" class="buckets-grid">
          <!-- Dynamic bucket cards will render here -->
        </div>
      </section>

    </main>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
